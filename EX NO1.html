<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8" />  
<meta name="viewport" content="width=device-width, initial-scale=1.0" />  
<title>Ex No: 1 – Semantic Layout</title>  
<style>  
html, body {  
height: 100%;  
margin: 0;  
padding: 0;  
}  
body {  
font-family: 'Segoe UI', sans-serif;  
display: flex;  
flex-direction: column;  
}  
header {  
background-color: #343a40;  
color: white;  
padding: 30px 20px;  
}  
nav {  
background-color: #e9e9e9;  
padding: 15px;  
}  
nav a {  
margin: 0 12px;  
text-decoration: none;  
color: #333;  
}  
nav a:hover {  
color: #007bff;  
}  
main {  
flex: 1;  
padding: 40px 20px;  
}  
footer {  
background-color: #343a40;  
color: #ccc;  
text-align: center;  
padding: 20px;  
font-size: 0.9em;  
}  
</style>  
</head>  
<body>  
<header>  
<h1>Full Stack Webpage</h1>  
<p>Using Semantic Elements</p>  
</header>  
<nav>  
<a href="#">Home</a>  
<a href="#">Services</a>  
<a href="#">About</a>  
<a href="#">Contact</a>  
</nav>  
<main>  
<section>  
<h2>Welcome!</h2>  
<p>This webpage demonstrates the use of semantic HTML5 elements for structured,accessible design.</p>  
</section>  
</main>  
<footer>  
<p>&copy; 2025 Seshasayee Institute of Technology – Designed by Niko</p>  
</footer>  
</body>  
</html>
